[project]
name = "hetero-inference-planner"
version = "0.1.0"
description = "A phase-aware heterogeneous inference planning lab for agentic LLM workloads."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
kernel = ["torch", "triton"]

[project.scripts]
phaseforge = "phaseforge.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
